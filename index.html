<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel = "stylesheet" href="index.css"> 
  </head>
  <body>
    <div class="searchBar">
        <div class="searchBarParentDiv">
            <input type="text" class="inputfield" placeholder="Search City">
            <img src ="./Assets/search.png" alt ="" width = "35px" class="searchIcon" onclick="fetchData()">
        </div>
    </div>
    <div class="mainContent d-flex" >
        
        <div class="leftDiv">
            <div class="currentTempDiv leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0" id="cityName">City Name</h6>
                <h5 class="m-0" ><span id="cityTemp">-</span>&deg;c</h5>
                <h6 class="m-0" id="skyDesc">sky description</h6>
                <hr class="line">
                <div class="d-flex gap-2">
                    <img src="./Assets/calendar.png" alt ="" width="25px">
                    <h6 id = "date">date</h6>
                </div>
                <div class="d-flex gap-2">
                    <img src="./Assets/clock.png" alt ="" width="25px">
                    <h6 id = "time"> time</h6>
                </div>
            </div>

            <div class="nextFiveDays leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0" id="comingFiveDays">Coming 5 Days</h6>
                <div class="d-flex flex-column gap-1" id="forecastContainer">
                    <!-- Forecast rows will be inserted here by JavaScript -->
                </div>
            </div>
        </div>

        <div class="rightDiv">
            <div class="rightRow rowOne d-flex gap-2 justify-content-between align-items-center">
                <div class="extraMetric d-flex gap-3" >
                    <img src="./Assets/wind.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Wind Speed</h6>
                        <h6 class="m-0" id="windSpeed">- m/s</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3" >
                    <img src="./Assets/humidity.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Humidity</h6>
                        <h6 class="m-0" id="humidity">- %</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3" >
                    <img src="./Assets/pressure.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Pressure</h6>
                        <h6 class="m-0" id="pressure">- hPa</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3" >
                    <img src="./Assets/visibility.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Visibility</h6>
                        <h6 class="m-0" id="visibility">- km</h6>
                    </div>
                </div>
            </div>

            <div class="rightRow rowTwo d-flex justify-content-between align-items-center">
                <div class="AQI rowTwoDiv p-3 d-flex flex-column gap-2">
                    <h5>Air Quality Index (AQI)</h5>
                    <div class ="d-flex align-items-center justify-content-between">
                        <img src="./Assets/wind1.png" alt ="" width ="40px">
                        <div class="text-center">
                            <h6 id="co"> CO </h6>
                            <h6 id="coValue">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="so2"> SO2 </h6>
                            <h6 id="so2Value">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="o3"> O3 </h6>
                            <h6 id="o3Value">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="no2"> NO2 </h6>
                            <h6 id="no2Value">0</h6>
                        </div>
                    </div>
                </div>
                
                <div class="sunRise rowTwoDiv p-3 gap-2">
                    <h5 class="m-0">Sunrise & Sunset</h5>
                    <div class="d-flex justify-content-between">
                        <div class="sunriseDiv d-flex gap-1 align-items-center" >
                            <img src="./Assets/sun.png" alt="" width="75px">
                            <div>
                                <h6 class="m-0">Sunrise</h6>
                                <h5 class="m-0 "id ="sunriseTime">-</h5>
                            </div>
                        </div>
                        <div class="sunsetDiv d-flex gap-1 align-items-center">
                            <img src="./Assets/moon.png" alt="" width="63px">
                            <div class="d-flex flex-column gap-2">
                                <h6 class="m-0">Sunset</h6>
                                <h5 class="m-0"id ="sunsetTime">-</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="rightRow rowThree d-flex flex-column gap-2">
                <h5 class="m-0">Today</h5>
                <div class="d-flex justify-content-between todayTempParentDiv" id="todayTempContainer">
                    <!-- Today's temps will be inserted here by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
